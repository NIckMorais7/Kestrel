[package]
name = "kestrel"
version = "0.9.8"
edition = "2024"
description = "Kestrel — agente autônomo de codificação para o terminal"
license = "MIT"
authors = ["Kestrel"]

[[bin]]
name = "kestrel"
path = "src/main.rs"

[dependencies]
anyhow = "1"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
dirs = "7"
futures-util = "0.3"
ignore = "0.4"
image = { version = "0.25", default-features = false, features = ["png"] }
landlock = "0.4"
libc = "0.2"
pulldown-cmark = "0.13"
ratatui = "0.30"
ratatui-image = { version = "11", default-features = false, features = ["crossterm"] }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "stream",
    "rustls-tls",
] }
ring = "0.17"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tiktoken-rs = "0.12"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
toml = "1"
unicode-width = "0.2"
uuid = { version = "1", features = ["v4"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[profile.dev]
opt-level = 1
